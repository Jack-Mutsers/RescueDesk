# Builds the Windows installer on every push to main and publishes it as a GitHub release.
# Versions come from git tags: the first release is v1.0.0, every later push bumps the
# last number (v1.0.1, v1.0.2, ...). To start a new minor/major line, push a tag like
# v1.1.0 or v2.0.0 yourself; the next push continues from there.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once, so two pushes can't grab the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - name: Work out next version
        id: version
        shell: pwsh
        run: |
          $versions = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } |
            Sort-Object -Descending
          if ($versions) {
            $last = $versions[0]
            $next = '{0}.{1}.{2}' -f $last.Major, $last.Minor, ($last.Build + 1)
          } else {
            $next = '1.0.0'
          }
          "version=$next" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$next"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release create "v$v" "dist/RescueDesk-Setup-$v.exe" `
            --target $env:GITHUB_SHA `
            --title "RescueDesk v$v" `
            --generate-notes
